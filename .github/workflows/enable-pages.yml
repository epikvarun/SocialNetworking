name: Enable GitHub Pages

on:
  push:
    branches: ['claude/social-profile-analyzer-LWXMB']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from gh-pages branch
        run: |
          echo "Enabling GitHub Pages..."
          # Try to create (POST) first, fall back to update (PUT)
          RESPONSE=$(curl -s -o /tmp/pages_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          cat /tmp/pages_response.json
          if [ "$RESPONSE" = "409" ]; then
            echo "Pages already exists, updating source..."
            curl -s \
              -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi
          echo "Done! Site will be live at https://epikvarun.github.io/SocialNetworking/"
